<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Activity & Finance Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
.container{max-width:1050px;margin:auto;padding:18px}
header{background:linear-gradient(135deg,#182848,#4b6cb7);color:white;padding:22px;border-radius:18px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:25px}header p{margin:0;opacity:.9}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card,.panel{background:white;border-radius:15px;padding:16px;box-shadow:0 2px 10px #0000000d}
.card small{color:#667085}.card strong{display:block;font-size:22px;margin-top:7px}
.panel{margin-bottom:16px}h2{font-size:18px;margin:0 0 13px}
form{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1.5fr auto;gap:9px}
input,select,button{padding:11px;border:1px solid #d5dbe3;border-radius:9px;font-size:14px}
button{background:#2563eb;color:white;border:0;cursor:pointer;font-weight:600}button.secondary{background:#64748b}button.danger{background:#dc2626}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f3;white-space:nowrap}th{font-size:12px;color:#667085}
.income{color:#15803d}.expense{color:#b91c1c}
.actions{display:flex;gap:8px;flex-wrap:wrap}.bar{height:18px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar span{display:block;height:100%;background:#4b6cb7}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters>*{flex:1;min-width:130px}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}
@media(max-width:480px){.container{padding:10px}h1{font-size:21px}.cards{gap:8px}.card{padding:12px}.card strong{font-size:18px}}
</style>
</head>
<body>
<div class="container">
<header><h1>📊 Daily Activity & Finance Tracker</h1><p>Track income, expenses, savings and daily activities in one place.</p></header>

<div class="cards">
<div class="card"><small>Total Income</small><strong id="income">₹0</strong></div>
<div class="card"><small>Total Expenses</small><strong id="expense">₹0</strong></div>
<div class="card"><small>Balance</small><strong id="balance">₹0</strong></div>
<div class="card"><small>Monthly Budget</small><strong id="budgetView">₹60,000</strong></div>
</div>

<div class="panel">
<h2>➕ Add Transaction</h2>
<form id="form">
<input type="date" id="date" required>
<select id="type"><option>Expense</option><option>Income</option></select>
<select id="category">
<option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option>
<option>Family</option><option>Travel</option><option>Investment</option><option>Health</option>
<option>Entertainment</option><option>Other</option>
</select>
<input type="number" id="amount" placeholder="Amount" min="0" step="0.01" required>
<input class="full" id="note" placeholder="Description / note">
<button>Add</button>
</form>
</div>

<div class="panel">
<h2>📅 Monthly Overview</h2>
<div id="monthStats"></div>
</div>

<div class="panel">
<h2>🔎 Transactions</h2>
<div class="filters">
<input type="month" id="monthFilter">
<select id="catFilter"><option value="">All categories</option></select>
<input id="search" placeholder="Search description">
</div>
<div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Amount</th><th>Note</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div>

<div class="panel">
<h2>⚙️ Data</h2>
<div class="actions">
<button class="secondary" onclick="exportCSV()">Export CSV</button>
<button class="secondary" onclick="backup()">Backup JSON</button>
<label class="secondary" style="padding:11px;border-radius:9px;color:white;background:#64748b;cursor:pointer">Restore JSON <input type="file" id="restore" accept=".json" hidden></label>
<button class="danger" onclick="clearAll()">Clear All</button>
</div>
</div>
</div>

<script>
const key='faheemFinanceTrackerV1';
let data=JSON.parse(localStorage.getItem(key)||'[]');
const cats=['Food','Transport','Shopping','Bills','Family','Travel','Investment','Health','Entertainment','Other'];
const $=id=>document.getElementById(id);
$('date').value=new Date().toISOString().slice(0,10);
cats.forEach(c=>$('catFilter').insertAdjacentHTML('beforeend',`<option>${c}</option>`));
$('monthFilter').value=new Date().toISOString().slice(0,7);

function save(){localStorage.setItem(key,JSON.stringify(data));render()}
function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n)}
function render(){
 let inc=data.filter(x=>x.type==='Income').reduce((a,x)=>a+x.amount,0);
 let exp=data.filter(x=>x.type==='Expense').reduce((a,x)=>a+x.amount,0);
 $('income').textContent=money(inc);$('expense').textContent=money(exp);$('balance').textContent=money(inc-exp);
 const m=$('monthFilter').value, mf=data.filter(x=>x.date.startsWith(m));
 const me=mf.filter(x=>x.type==='Expense').reduce((a,x)=>a+x.amount,0);
 const mi=mf.filter(x=>x.type==='Income').reduce((a,x)=>a+x.amount,0);
 const pct=Math.min(100,me/60000*100);
 $('monthStats').innerHTML=`<b>${m}</b> — Income ${money(mi)} · Expenses ${money(me)} · Remaining budget ${money(60000-me)}
 <div class="bar"><span style="width:${pct}%"></span></div><small>${pct.toFixed(1)}% of ₹60,000 budget used</small>`;
 let cat=$('catFilter').value, q=$('search').value.toLowerCase();
 let view=data.filter(x=>(!m||x.date.startsWith(m))&&(!cat||x.category===cat)&&(!q||x.note.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
 $('rows').innerHTML=view.length?view.map(x=>`<tr><td>${x.date}</td><td class="${x.type==='Income'?'income':'expense'}">${x.type}</td><td>${x.category}</td><td class="${x.type==='Income'?'income':'expense'}">${money(x.amount)}</td><td>${escapeHtml(x.note)}</td><td><button class="danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join(''):'<tr><td colspan="6">No transactions found.</td></tr>';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('form').onsubmit=e=>{e.preventDefault();data.push({id:Date.now().toString(),date:$('date').value,type:$('type').value,category:$('category').value,amount:+$('amount').value,note:$('note').value});$('amount').value='';$('note').value='';save()}
function del(id){data=data.filter(x=>x.id!==id);save()}
['monthFilter','catFilter','search'].forEach(id=>$(id).addEventListener('input',render));
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportCSV(){let csv='Date,Type,Category,Amount,Note\\n'+data.map(x=>[x.date,x.type,x.category,x.amount,'"'+x.note.replaceAll('"','""')+'"'].join(',')).join('\\n');download(new Blob([csv],{type:'text/csv'}),'finance-tracker.csv')}
function backup(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'finance-tracker-backup.json')}
$('restore').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save()}catch{alert('Invalid backup file')}};r.readAsText(f)}
function clearAll(){if(confirm('Delete all transactions?')){data=[];save()}}
render();
</script>
</body></html>
